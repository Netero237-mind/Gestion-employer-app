{% extends "employe/base.html" %}

{% block content %}

<div class="max-w-lg mx-auto">
  <div class="mb-6">
    <a href="/" class="btn btn-ghost btn-sm gap-1 mb-4">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Retour
    </a>
    <h1 class="text-2xl font-bold text-base-content">✏️ Modifier un employé</h1>
    <p class="text-base-content opacity-60 text-sm mt-1">Modification de : <strong>{{ employe.nom }}</strong></p>
  </div>

  <div class="card bg-base-100 shadow-xl">
    <div class="card-body p-6">
      <form method="POST">
        {% csrf_token %}
        <div class="space-y-4">

          <div class="form-control">
            <label class="label"><span class="label-text font-semibold">Nom complet</span></label>
            {{ form.nom }}
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text font-semibold">Adresse email</span></label>
            {{ form.email }}
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text font-semibold">Poste / Fonction</span></label>
            {{ form.poste }}
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text font-semibold">Salaire mensuel (FCFA)</span></label>
            {{ form.salaire }}
          </div>

        </div>

        <div class="card-actions justify-end mt-6 gap-2">
          <a href="/" class="btn btn-ghost">Annuler</a>
          <button type="submit" class="btn btn-info gap-2 text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
            </svg>
            Mettre à jour
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% endblock %}
