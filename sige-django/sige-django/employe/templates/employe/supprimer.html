{% extends "employe/base.html" %}

{% block content %}

<div class="max-w-md mx-auto">
  <div class="card bg-base-100 shadow-xl border border-error/30">
    <div class="card-body p-8 text-center">
      <div class="text-6xl mb-4">⚠️</div>
      <h2 class="card-title text-2xl justify-center text-error mb-2">Confirmer la suppression</h2>
      <p class="text-base-content opacity-70 mb-2">
        Vous êtes sur le point de supprimer définitivement :
      </p>
      <div class="bg-base-200 rounded-xl p-4 my-4">
        <p class="font-bold text-lg text-base-content">{{ employe.nom }}</p>
        <p class="text-sm text-base-content opacity-60">{{ employe.poste }} — {{ employe.email }}</p>
      </div>
      <p class="text-error text-sm font-semibold">Cette action est irréversible.</p>

      <div class="card-actions justify-center mt-6 gap-3">
        <a href="/" class="btn btn-ghost btn-lg">Annuler</a>
        <form method="POST">
          {% csrf_token %}
          <button type="submit" class="btn btn-error btn-lg gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
            Oui, supprimer
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
